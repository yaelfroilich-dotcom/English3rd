  <style>
    :root {
      --bg-sky: #FFF9EC;
      --card-white: #FFFFFF;
      --primary-orange: #FF8C42;
      --primary-blue: #3B82F6;
      --mint-green: #10B981;
      --berry-pink: #EC4899;
      --sunny-yellow: #FBBF24;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Rubik', sans-serif;
      background: radial-gradient(circle at 15% 15%, #FFE8D6 0%, #FFF9EC 45%, #E0F2FE 100%);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      color: #1E293B;
    }

    .en-font {
      font-family: 'Fredoka', sans-serif;
      direction: ltr;
      unicode-bidi: isolate;
    }

    /* Paw print background pattern */
    .paw-bg {
      background-image: radial-gradient(rgba(255, 140, 66, 0.12) 2px, transparent 2px),
                        radial-gradient(rgba(59, 130, 246, 0.10) 2px, transparent 2px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
    }

    /* 3D Toy Button Style */
    .toy-btn {
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.16);
    }
    .toy-btn:hover:not(:disabled) {
      transform: translateY(-2px);
    }
    .toy-btn:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.16);
    }
    .toy-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Mascot Animations */
    @keyframes floatBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1.5deg); }
    }
    @keyframes happyJump {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-18px) scale(1.08) rotate(-4deg); }
      60% { transform: translateY(-8px) scale(1.04) rotate(4deg); }
    }
    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px) rotate(-2deg); }
      40% { transform: translateX(8px) rotate(2deg); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.65); }
      50% { box-shadow: 0 0 0 12px rgba(251, 191, 36, 0); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.82) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .animate-bob { animation: floatBob 3s ease-in-out infinite; }
    .animate-jump { animation: happyJump 0.65s ease-in-out; }
    .animate-shake { animation: gentleShake 0.45s ease-in-out; }
    .animate-pop { animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .pulse-speaker { animation: pulseGlow 2s infinite; }

    /* Option Cards */
    .option-card {
      background: #FFFFFF;
      border: 3px solid #E2E8F0;
      border-radius: 1.5rem;
      box-shadow: 0 6px 0 #CBD5E1;
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }
    .option-card:hover:not(.disabled-card) {
      border-color: #60A5FA;
      transform: translateY(-3px);
      box-shadow: 0 9px 0 #93C5FD;
    }
    .option-card:active:not(.disabled-card) {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #93C5FD;
    }
    .option-card.correct-card {
      background: #DCFCE7 !important;
      border-color: #22C55E !important;
      box-shadow: 0 6px 0 #16A34A !important;
      color: #14532D !important;
    }
    .option-card.wrong-card {
      background: #FEE2E2 !important;
      border-color: #EF4444 !important;
      box-shadow: 0 6px 0 #DC2626 !important;
      color: #7F1D1D !important;
    }
    .disabled-card {
      pointer-events: none;
    }

    /* Confetti Canvas */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

  <script>
    /*************************************************************************
     * 1. SOUND ENGINE (Web Audio API Synthesizer + Web Speech API TTS)
     *************************************************************************/
    let isMuted = false;
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function toggleMute() {
      isMuted = !isMuted;
      const btn = document.getElementById('btn-mute');
      btn.textContent = isMuted ? '🔇' : '🔊';
      if (isMuted && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      } else {
        playPop();
      }
    }

    // Gentle UI click pop
    function playPop() {
      if (isMuted) return;
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(780, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.09);
      } catch (e) {}
    }

    // Cute Puppy Bark ("האו!")
    function playBark() {
      if (isMuted) return;
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        [0, 0.16].forEach((offset, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          const baseFreq = idx === 0 ? 340 : 410;
          osc.frequency.setValueAtTime(baseFreq, now + offset);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.45, now + offset + 0.04);
          osc.frequency.exponentialRampToValueAtTime(190, now + offset + 0.12);

          // Lowpass filter to make it warm and cute
          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1100, now + offset);

          gain.gain.setValueAtTime(0.01, now + offset);
          gain.gain.linearRampToValueAtTime(0.22, now + offset + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.13);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.14);
        });
      } catch (e) {}
    }

    // Cute Kitten Meow ("מיאו!")
    function playMeow() {
      if (isMuted) return;
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(860, now + 0.14);
        osc.frequency.exponentialRampToValueAtTime(610, now + 0.42);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.22, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.44);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.45);
      } catch (e) {}
    }

    // Sparkling Win Chime
    function playWinChime() {
      if (isMuted) return;
      try {
        const ctx = getAudioCtx();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          const start = ctx.currentTime + i * 0.08;
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.2, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.36);
        });
      } catch (e) {}
    }

    // Gentle Boing on Wrong Answer
    function playGentleBoing() {
      if (isMuted) return;
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(175, now + 0.28);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.31);
      } catch (e) {}
    }

    // Victory Fanfare at Stage End
    function playFanfare() {
      if (isMuted) return;
      try {
        const ctx = getAudioCtx();
        const melody = [
          { f: 523.25, t: 0, d: 0.14 },
          { f: 659.25, t: 0.15, d: 0.14 },
          { f: 783.99, t: 0.30, d: 0.14 },
          { f: 1046.50, t: 0.46, d: 0.45 }
        ];
        melody.forEach(note => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          const start = ctx.currentTime + note.t;
          osc.frequency.setValueAtTime(note.f, start);
          gain.gain.setValueAtTime(0.24, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + note.d);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + note.d + 0.02);
        });
      } catch (e) {}
    }

    // English Speech Synthesis Helper
    function speakEnglish(text, rate = 0.85) {
      if (isMuted) return;
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = rate;
      utterance.pitch = 1.08; // Friendly warm tone
      const voices = window.speechSynthesis.getVoices();
      const enVoice = voices.find(v => v.lang.startsWith('en-US') && (v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Natural')))
                   || voices.find(v => v.lang.startsWith('en'));
      if (enVoice) utterance.voice = enVoice;
      window.speechSynthesis.speak(utterance);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

      { speak: "A", target: "A", hint: "האות A גדולה", options: ["A", "B", "D", "G"] },
      { speak: "B", target: "b", hint: "האות b קטנה", options: ["b", "d", "n", "g"] },

    const STAGE2_POOL = [

    // Stage 3: Starting & Ending Letters from {A, B, N, D, G}
    const STAGE3_POOL = [

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function updateScoreUI() {
      document.getElementById('score-display').textContent = state.score;
    }

    function goHome() {
      playPop();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      state.screen = 'home';
      render();

    function startStage(stageId) {
      playPop();
      state.currentStageId = stageId;
      state.qIndex = 0;
      state.stageMistakes = 0;
      state.answered = false;
      state.mascotMood = 'happy';

      // Build question list for each stage
      if (stageId === 1) {
        state.questions = shuffle(STAGE1_POOL).slice(0, 6);
      } else if (stageId === 2) {
        state.questions = shuffle(STAGE2_POOL).slice(0, 5);
      } else if (stageId === 3) {
        state.questions = shuffle(STAGE3_POOL).slice(0, 6);
      } else if (stageId === 4) {
        state.questions = shuffle(STAGE4_POOL).slice(0, 6);
      } else if (stageId === 5) {
        // Ensure all 7 words appear in Stage 5!
        state.questions = [
          STAGE5_POOL[0], // dad (meaning)
          STAGE5_POOL[1], // bag (spell)
          STAGE5_POOL[2], // banana (meaning)
          STAGE5_POOL[4], // look (meaning)
          STAGE5_POOL[5], // bad (spell)
          STAGE5_POOL[6], // I am (meaning)
          STAGE5_POOL[7]  // and (spell)
        ];
      } else if (stageId === 6) {
        state.questions = shuffle(STAGE6_POOL).slice(0, 5);
      }

      state.screen = 'stage';
      prepareCurrentQuestion();
      render();
    }

    function prepareCurrentQuestion() {
      state.answered = false;
      state.mascotMood = 'happy';
      const q = state.questions[state.qIndex];
      const stage = STAGES_META.find(s => s.id === state.currentStageId);

      // Default encouraging Hebrew prompt
      const prompts = {
        1: "הקשיבו טוב לשם האות באנגלית ובחרו את האות הנכונה!",
        2: "עזרו להורה ולגור למצוא זה את זה! התאימו גדולה וקטנה:",
        3: q.type === "start" ? "איזו אות פותחת את המילה?" : "איזו אות מסיימת את המילה?",
        4: q.prompt,
        5: q.mode === "meaning" ? "קראו והקשיבו למילה — מה הפירוש שלה?" : "סדרו את האותיות לפי הסדר כדי לכתוב את המילה!",
        6: "הקשיבו למשפט באנגלית ובחרו את התמונה המתאימה!"
      };
      state.mascotMessage = prompts[state.currentStageId];

      // Setup Stage 5 Spelling Builder tiles if needed
      if (state.currentStageId === 5 && q.mode === 'spell') {
        state.spellBuilt = [];
        const rawTiles = [...q.tiles, ...q.extra];
        state.spellPool = shuffle(rawTiles.map((ch, idx) => ({ id: idx, char: ch, used: false })));
      }

      // Auto-speak audio for the question after brief render delay
      setTimeout(() => {
        playQuestionAudio();
      }, 280);
    }

    function playQuestionAudio() {
      const q = state.questions[state.qIndex];
      if (!q) return;
      if (state.currentStageId === 1) {
        speakEnglish(q.speak, 0.8);
      } else if (state.currentStageId === 2) {
        speakEnglish(q.upper, 0.8);
      } else if (state.currentStageId === 3) {
        speakEnglish(q.word, 0.82);
      } else if (state.currentStageId === 4) {
        speakEnglish(q.speak, 0.82);
      } else if (state.currentStageId === 5) {
        speakEnglish(q.speak, 0.82);
      } else if (state.currentStageId === 6) {
        speakEnglish(q.speak, 0.82);
      }
    }

    /*************************************************************************
     * 5. ANSWER HANDLING & REWARDS
     *************************************************************************/
    function handleChoice(selectedValue, btnEl) {
      if (state.answered) return;
      const q = state.questions[state.qIndex];
      let isCorrect = false;

      if (state.currentStageId === 1) {
        isCorrect = selectedValue === q.target;
      } else if (state.currentStageId === 2) {
        isCorrect = selectedValue === (q.reverse ? q.upper : q.lower);
      } else if (state.currentStageId === 3) {
        isCorrect = selectedValue === q.answer;
      } else if (state.currentStageId === 4) {
        isCorrect = String(selectedValue) === String(q.answer);
      } else if (state.currentStageId === 5 && q.mode === 'meaning') {
        isCorrect = selectedValue === q.hebrew;
      } else if (state.currentStageId === 6) {
        isCorrect = selectedValue === q.answer;
      }

      if (isCorrect) {
        state.answered = true;
        state.score += 10;
        updateScoreUI();
        if (btnEl) btnEl.classList.add('correct-card');
        celebrateCorrectAnswer();
      } else {
        state.stageMistakes++;
        if (btnEl) {
          btnEl.classList.add('wrong-card', 'animate-shake');
          setTimeout(() => btnEl.classList.remove('wrong-card', 'animate-shake'), 650);
        }
        handleWrongAnswer();
      }
    }

    // Stage 5 Spelling Tile Clicks
    function pickSpellTile(tileId) {
      if (state.answered) return;
      const tile = state.spellPool.find(t => t.id === tileId);
      if (!tile || tile.used) return;
      playPop();
      tile.used = true;
      state.spellBuilt.push(tile);
      render();

      const q = state.questions[state.qIndex];
      if (state.spellBuilt.length === q.tiles.length) {
        const builtWord = state.spellBuilt.map(t => t.char).join('');
        if (builtWord === q.word) {
          state.answered = true;
          state.score += 15;
          updateScoreUI();
          celebrateCorrectAnswer();
        } else {
          state.stageMistakes++;
          handleWrongAnswer("אופס! נסו לסדר את האותיות שוב 🐾");
          setTimeout(() => {
            clearSpellTiles(true);
          }, 700);
        }
      }
    }

    function clearSpellTiles(silent = false) {
      if (state.answered) return;
      if (!silent) playPop();
      state.spellBuilt = [];
      state.spellPool.forEach(t => t.used = false);
      render();

      const stage = STAGES_META.find(s => s.id === state.currentStageId);

          prepareCurrentQuestion();
          render();
        } else {
          finishStage();
        }
      }, 1350);

      playFanfare();
      launchConfetti();

      const allDone = Object.keys(state.completedStages).length === STAGES_META.length;
      state.screen = allDone ? 'victory' : 'stageComplete';
      render();
    }

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            ${STAGES_META.map(stage => {
              const stars = state.completedStages[stage.id] || 0;
              const isDone = stars > 0;
              return `
                <button onclick="startStage(${stage.id})" class="toy-btn text-right bg-white border-4 ${isDone ? 'border-emerald-400' : 'border-slate-200'} rounded-3xl p-4 flex flex-col justify-between gap-3 relative overflow-hidden group">
                  <div class="flex items-start justify-between w-full">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br ${stage.color} text-white flex items-center justify-center text-2xl shadow-sm">
                      ${stage.icon}
                    </div>
                    <div class="flex items-center gap-1 bg-slate-100 px-2.5 py-1 rounded-full text-sm font-bold">
                      <span>${stars >= 1 ? '⭐' : '☆'}</span>
                      <span>${stars >= 2 ? '⭐' : '☆'}</span>
                      <span>${stars >= 3 ? '⭐' : '☆'}</span>
                    </div>
                  </div>

                  <div>
                    <div class="text-xs font-bold text-slate-400">תחנה ${stage.id}</div>
                    <h2 class="text-lg sm:text-xl font-extrabold text-slate-800 group-hover:text-blue-600 transition-colors">
                      ${stage.title}
                    </h2>
                    <p class="en-font text-sm font-semibold text-slate-500 mt-0.5">
                      ${stage.subtitle}
                    </p>
                  </div>

                  <div class="w-full pt-2 border-t border-slate-100 flex items-center justify-between text-xs font-extrabold ${isDone ? 'text-emerald-600' : 'text-blue-600'}">
                    <span>${isDone ? 'הושלם! לחצו לתרגול נוסף' : 'לחצו להתחלת השלב'}</span>
                    <span>◀</span>
                  </div>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderStage(container) {
      const stage = STAGES_META.find(s => s.id === state.currentStageId);
      const q = state.questions[state.qIndex];
      const totalQ = state.questions.length;
      const svg = stage.pet === 'rocky' ? getRockySVG(state.mascotMood) : getLunaSVG(state.mascotMood);

      container.innerHTML = `
        <div class="animate-pop flex-1 flex flex-col justify-between gap-4">
          <!-- Stage Header & Question Progress -->
          <div class="bg-white/90 border-2 border-slate-200 rounded-2xl px-4 py-2.5 flex items-center justify-between gap-3">
            <div class="flex items-center gap-2">
              <span class="text-xl">${stage.icon}</span>
              <span class="font-extrabold text-slate-800 text-sm sm:text-base">שלב ${stage.id}: ${stage.title}</span>
            </div>
            <div class="flex items-center gap-1.5">
              ${Array.from({ length: totalQ }).map((_, idx) => `
                <span class="w-3 h-3 sm:w-3.5 sm:h-3.5 rounded-full ${idx < state.qIndex ? 'bg-emerald-400' : (idx === state.qIndex ? 'bg-amber-400 ring-2 ring-amber-200' : 'bg-slate-200')}"></span>
              `).join('')}
            </div>
          </div>

          <!-- Mascot Guidance Banner -->
          <div id="mascot-box" class="flex items-center gap-3">
            <div class="animate-bob shrink-0">${svg}</div>
            <div class="bg-white border-3 border-amber-300 rounded-2xl px-4 py-3 shadow-sm flex-1">
              <div class="text-xs font-bold text-amber-600 mb-0.5">${stage.pet === 'rocky' ? 'רוקי הכלבלב אומר:' : 'לונה החתלתולה אומרת:'}</div>
              <div class="text-base sm:text-lg font-extrabold text-slate-800">${state.mascotMessage}</div>
            </div>
          </div>

          <!-- Main Question Board -->
          <div class="bg-white border-4 border-sky-200 rounded-3xl p-4 sm:p-6 shadow-md flex-1 flex flex-col items-center justify-center gap-5">
            ${renderQuestionContent(stage.id, q)}
          </div>
        </div>
      `;
    }

    function renderQuestionContent(stageId, q) {
      // Prominent Replay Audio Button
      const replayBtn = `
        <button onclick="playQuestionAudio()" class="toy-btn pulse-speaker bg-gradient-to-b from-amber-400 to-orange-400 text-slate-950 font-extrabold text-lg sm:text-xl px-6 py-3 rounded-2xl border-2 border-orange-500 flex items-center gap-2.5">
          <span>השמע שוב</span>
          <span class="text-2xl">🔊</span>
        </button>
      `;

      // STAGE 1: Letter Identification by Sound
      if (stageId === 1) {
        const opts = shuffle(q.options);
        return `
          <div class="text-center space-y-2">
            ${replayBtn}
            <div class="text-sm font-bold text-slate-500">רמז: חפשו את <span class="text-blue-600">${q.hint}</span></div>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 w-full max-w-xl">
            ${opts.map(letter => `
              <button onclick="handleChoice('${letter}', this)" class="option-card py-6 sm:py-8 flex flex-col items-center justify-center gap-1">
                <span class="text-2xl">${Math.random() > 0.5 ? '🐶' : '🐱'}</span>
                <span class="en-font text-5xl sm:text-6xl font-bold text-slate-800">${letter}</span>
              </button>
            `).join('')}
          </div>
        `;
      }

      // STAGE 2: Uppercase <-> Lowercase Matching
      if (stageId === 2) {
        const promptLetter = q.reverse ? q.lower : q.upper;
        const opts = shuffle(q.options);
        return `
          <div class="flex flex-col items-center gap-2">
            <div class="bg-sky-50 border-4 border-sky-300 rounded-3xl px-8 py-4 flex items-center gap-4">
              <span class="text-4xl">🐕</span>
              <span class="en-font text-6xl font-bold text-sky-900">${promptLetter}</span>
              <button onclick="playQuestionAudio()" class="bg-sky-200 hover:bg-sky-300 w-10 h-10 rounded-full flex items-center justify-center text-lg" title="השמע אות">🔊</button>
            </div>
            <p class="text-sm font-bold text-slate-500">${q.reverse ? 'בחרו את האות הגדולה המתאימה:' : 'בחרו את האות הקטנה המתאימה:'}</p>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 w-full max-w-xl">
            ${opts.map(letter => `
              <button onclick="handleChoice('${letter}', this)" class="option-card py-6 flex flex-col items-center justify-center gap-1">
                <span class="text-2xl">🐾</span>
                <span class="en-font text-5xl font-bold text-slate-800">${letter}</span>
              </button>
            `).join('')}
          </div>
        `;
      }

      // STAGE 3: Starting & Ending Letter from {A, B, N, D, G}
      if (stageId === 3) {
        const opts = shuffle(q.options);
        return `
          <div class="flex flex-col items-center gap-3">
            <div class="bg-amber-50 border-3 border-amber-300 rounded-3xl px-6 py-4 flex items-center gap-4">
              <span class="text-5xl sm:text-6xl">${q.emoji}</span>
              <div class="text-right">
                <div class="en-font text-4xl sm:text-5xl font-bold tracking-wider text-slate-800">${q.display}</div>
                <div class="text-sm font-bold text-slate-500 mt-1">(${q.hebrew})</div>
              </div>
            </div>
            ${replayBtn}
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 w-full max-w-xl">
            ${opts.map(letter => `
              <button onclick="handleChoice('${letter}', this)" class="option-card py-5 flex flex-col items-center justify-center">
                <span class="en-font text-4xl sm:text-5xl font-bold text-indigo-700">${letter} / ${letter.toLowerCase()}</span>
              </button>
            `).join('')}
          </div>
        `;
      }

      // STAGE 4: Colors & Numbers
      if (stageId === 4) {
        const opts = shuffle(q.options);
        return `
          <div class="flex flex-col items-center gap-2">
            ${replayBtn}
          </div>
          <div class="grid grid-cols-2 gap-3 sm:gap-4 w-full max-w-xl">
            ${opts.map(opt => {
              if (q.kind === 'color') {
                return `
                  <button onclick="handleChoice('${opt.id}', this)" class="option-card p-4 sm:p-5 flex flex-col items-center justify-center gap-2">
                    <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full border-4 border-white shadow-md" style="background-color: ${opt.hex};"></div>
                    <span class="font-extrabold text-lg text-slate-700">🧶 צבע</span>
                  </button>
                `;
              } else {
                return `
                  <button onclick="handleChoice('${opt.id}', this)" class="option-card p-4 sm:p-5 flex flex-col items-center justify-center gap-2 min-h-[110px]">
                    <div class="text-2xl sm:text-3xl leading-relaxed tracking-widest text-center">${opt.emojis}</div>
                  </button>
                `;
              }
            }).join('')}
          </div>
        `;
      }

      // STAGE 5: Key Words (Reading/Meaning + Interactive Letter-Tile Spelling)
      if (stageId === 5) {
        if (q.mode === 'meaning') {
          const allChoices = shuffle([q.hebrew, ...q.distractors]);
          return `
            <div class="flex flex-col items-center gap-3">
              <div class="bg-purple-50 border-4 border-purple-300 rounded-3xl px-8 py-4 flex items-center gap-4">
                <span class="en-font text-5xl sm:text-6xl font-bold text-purple-900">${q.word}</span>
                <button onclick="playQuestionAudio()" class="bg-purple-200 hover:bg-purple-300 w-12 h-12 rounded-full flex items-center justify-center text-2xl">🔊</button>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3 sm:gap-4 w-full max-w-xl">
              ${allChoices.map(choice => `
                <button onclick="handleChoice('${choice}', this)" class="option-card py-5 px-4 flex flex-col items-center justify-center gap-1">
                  ${choice === q.hebrew ? `<span class="text-3xl">${q.emoji}</span>` : `<span class="text-2xl">🐾</span>`}
                  <span class="font-extrabold text-xl sm:text-2xl text-slate-800">${choice}</span>
                </button>
              `).join('')}
            </div>
          `;
        } else {
          // Spelling Builder Mode!
          return `
            <div class="flex flex-col items-center gap-2">
              <div class="flex items-center gap-3 bg-indigo-50 border-2 border-indigo-200 px-5 py-2.5 rounded-2xl">
                <span class="text-4xl">${q.emoji}</span>
                <span class="font-extrabold text-xl text-indigo-950">${q.hebrew}</span>
                <button onclick="playQuestionAudio()" class="bg-amber-400 hover:bg-amber-300 px-3 py-1.5 rounded-xl font-bold text-sm flex items-center gap-1">
                  <span>השמע</span> <span>🔊</span>
                </button>
              </div>
            </div>

            <!-- Target Letter Slots (LTR) -->
            <div dir="ltr" class="flex flex-wrap items-center justify-center gap-2 sm:gap-3 my-1">
              ${q.tiles.map((_, idx) => {
                const filled = state.spellBuilt[idx];
                const displayChar = filled ? (filled.char === ' ' ? '␣' : filled.char) : '';
                return `
                  <div class="en-font w-12 h-14 sm:w-14 sm:h-16 rounded-2xl border-4 ${filled ? 'border-emerald-400 bg-emerald-50 text-emerald-900' : 'border-dashed border-slate-300 bg-slate-50'} flex items-center justify-center text-3xl sm:text-4xl font-bold shadow-inner">
                    ${displayChar}
                  </div>
                `;
              }).join('')}
            </div>

            <!-- Clickable Letter Pool -->
            <div dir="ltr" class="flex flex-wrap items-center justify-center gap-2.5 sm:gap-3">
              ${state.spellPool.map(tile => `
                <button onclick="pickSpellTile(${tile.id})" ${tile.used ? 'disabled' : ''} class="toy-btn en-font w-12 h-14 sm:w-14 sm:h-16 rounded-2xl bg-amber-300 hover:bg-amber-200 border-2 border-amber-500 text-3xl sm:text-4xl font-bold text-slate-900 flex items-center justify-center ${tile.used ? 'opacity-25 scale-90' : ''}">
                  ${tile.char === ' ' ? '␣' : tile.char}
                </button>
              `).join('')}
            </div>

            <button onclick="clearSpellTiles()" class="text-sm font-bold text-slate-500 hover:text-rose-600 underline mt-1">
              נקה אותיות והתחל מחדש ↺
            </button>
          `;
        }
      }

      // STAGE 6: Listening Comprehension
      if (stageId === 6) {
        const opts = shuffle(q.options);
        return `
          <div class="flex flex-col items-center gap-2">
            ${replayBtn}
          </div>
          <div class="grid grid-cols-2 gap-3 sm:gap-4 w-full max-w-xl">
            ${opts.map(opt => `
              <button onclick="handleChoice('${opt.id}', this)" class="option-card p-4 sm:p-5 flex flex-col items-center justify-center gap-2">
                <div class="text-3xl sm:text-4xl tracking-wider">${opt.scene}</div>
                <div class="font-bold text-sm sm:text-base text-slate-600">${opt.caption}</div>
              </button>
            `).join('')}
          </div>
        `;
      }
    }

    function renderStageComplete(container) {
      const stage = STAGES_META.find(s => s.id === state.currentStageId);
      const stars = state.completedStages[state.currentStageId] || 3;
      const nextId = STAGES_META.find(s => !state.completedStages[s.id])?.id || (state.currentStageId % 6) + 1;

      container.innerHTML = `
        <div class="animate-pop bg-white border-4 border-amber-300 rounded-3xl p-6 sm:p-8 text-center max-w-xl mx-auto my-auto shadow-xl space-y-5">
          <div class="flex justify-center gap-4">
            <div class="animate-jump">${getRockySVG('happy')}</div>
            <div class="animate-jump" style="animation-delay:0.2s">${getLunaSVG('happy')}</div>
          </div>

          <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900">
            כל הכבוד! סיימתם את שלב ${stage.id}! 🎉
          </h2>
          <p class="text-slate-600 font-bold text-lg">${stage.title}</p>

          <div class="flex justify-center gap-3 text-4xl sm:text-5xl py-2">
            <span>${stars >= 1 ? '⭐' : '☆'}</span>
            <span>${stars >= 2 ? '⭐' : '☆'}</span>
            <span>${stars >= 3 ? '⭐' : '☆'}</span>
          </div>

          <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
            <button onclick="startStage(${nextId})" class="toy-btn w-full sm:w-auto bg-gradient-to-b from-emerald-400 to-emerald-500 text-white font-extrabold text-lg px-7 py-3.5 rounded-2xl border-2 border-emerald-600">
              לשלב הבא 🚀
            </button>
            <button onclick="goHome()" class="toy-btn w-full sm:w-auto bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold text-base px-6 py-3.5 rounded-2xl border-2 border-amber-300">
              חזרה למפה 🏠
            </button>
          </div>
        </div>
      `;
    }

    function renderVictory(container) {
      container.innerHTML = `
        <div class="animate-pop bg-gradient-to-b from-yellow-50 to-white border-4 border-yellow-400 rounded-3xl p-6 sm:p-8 text-center max-w-xl mx-auto my-auto shadow-2xl space-y-5">
          <div class="text-6xl sm:text-7xl animate-bounce">🏆</div>
          <div class="flex justify-center gap-4">
            <div class="animate-jump">${getRockySVG('happy')}</div>
            <div class="animate-jump" style="animation-delay:0.2s">${getLunaSVG('happy')}</div>
          </div>

          <h2 class="text-3xl sm:text-4xl font-extrabold text-slate-900">
            אלופי האנגלית של שכבת ג׳! 🌟
          </h2>
          <p class="text-slate-700 font-bold text-base sm:text-lg">
            השלמתם את כל 6 התחנות בהצלחה ואתם מוכנים למבחן ביחידה 1!
          </p>

          <div class="bg-amber-100 border-2 border-amber-400 rounded-2xl py-3 px-6 inline-block font-extrabold text-xl text-amber-950">
            ניקוד כולל: ${state.score} ⭐
          </div>

          <div class="pt-3">
            <button onclick="resetAllAndPlay()" class="toy-btn bg-gradient-to-b from-blue-500 to-indigo-600 text-white font-extrabold text-xl px-8 py-4 rounded-2xl border-2 border-indigo-700">
              שחק שוב מההתחלה 🔄
            </button>
          </div>
        </div>
      `;
    }

    function resetAllAndPlay() {
      playPop();
      state.score = 0;
      state.completedStages = {};
      updateScoreUI();
      goHome();
    }

    /*************************************************************************
     * 7. CONFETTI CELEBRATION ENGINE
     *************************************************************************/
    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#FBBF24', '#34D399', '#60A5FA', '#F472B6', '#FB923C', '#A78BFA'];
      const particles = Array.from({ length: 85 }).map(() => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.4,
        size: 7 + Math.random() * 8,
        color: colors[Math.floor(Math.random() * colors.length)],
        speedY: 2.5 + Math.random() * 3.5,
        speedX: -2 + Math.random() * 4,
        rot: Math.random() * 360,
        rotSpeed: -6 + Math.random() * 12
      }));

      let frame = 0;
      function tick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.speedX;
          p.y += p.speedY;
          p.rot += p.rotSpeed;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
          ctx.restore();
        });
        frame++;
        if (frame < 130) {
          requestAnimationFrame(tick);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(tick);
    }

    // Initial Render
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
